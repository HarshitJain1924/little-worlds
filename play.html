<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d1730" />
    <title>Little Worlds — First Playable</title>
  </head>
  <body>
    <canvas id="scene" aria-label="Third-person action RPG prototype"></canvas>

    <div id="hud">
      <div id="stats" class="panel"></div>
      <div id="objective" class="panel">Reach the ruin · defeat the skeletons</div>

      <div id="vitals" class="panel">
        <p class="name">Knight</p>
        <div class="bar"><span id="hp-fill"></span></div>
      </div>

      <div id="enemy-bars"></div>
      <div id="damage-numbers"></div>
      <div id="target" hidden><span class="diamond"></span><span class="label"></span></div>

      <div id="stick" hidden><span id="stick-knob"></span></div>
      <button id="attack" type="button" aria-label="Light attack">⚔</button>
      <button id="heavy" type="button" aria-label="Heavy attack">⚡</button>
      <button id="dodge" type="button" aria-label="Dodge">↯</button>
      <button id="block" type="button" aria-label="Block">🛡</button>
      <button id="lock" type="button" aria-label="Lock on">◎</button>

      <p id="capture" hidden>Click to capture mouse · Esc to release</p>
      <p id="hint">WASD move · Shift run · Space jump · J attack · K heavy · F / RMB block · C dodge · Tab lock · Q switch · M mute · Esc release</p>

      <div id="flash"></div>
      <div id="banner" hidden><p></p></div>
    </div>

    <div id="loading">
      <div class="loading-inner">
        <p class="loading-title">Little Worlds</p>
        <div class="loading-bar"><span id="loading-fill"></span></div>
        <p id="loading-label">entering the wood…</p>
      </div>
    </div>

    <script type="module" src="/src/play/main.ts"></script>
  </body>
</html>
